name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test, validate, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Set up pnpm (version from packageManager)
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test

      - name: Validate mascot models (strict)
        run: pnpm validate:model

      - name: Check placeholder models are up to date
        run: pnpm build:placeholder --check

      - name: Build
        run: pnpm build

      - name: Bundle budget
        run: pnpm size

      # ubuntu-latest ships Google Chrome, which Playwright uses (channel: chrome).
      # Without a GPU the stage detects a software renderer and runs the low tier.
      - name: End-to-end tests
        run: pnpm e2e

      - name: Upload review captures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: review-captures
          path: |
            scripts/review/out/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
