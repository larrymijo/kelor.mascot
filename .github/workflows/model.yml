name: Model

# Builds Kelo with headless Blender whenever the source, the fit or the
# pipeline changes on a feature branch, then commits the GLBs, review renders
# and the pipeline log back to that branch (artifacts and logs need a token
# to download, commits do not).
on:
  push:
    branches-ignore: [main]
    paths:
      - assets/source/**
      - assets/model/**
      - scripts/blender/**
      - scripts/assets/model/**
      - scripts/assets/assembly/**
      - scripts/assets/build-model.mjs
      - scripts/assets/placeholder-clips.mjs
      - character.json
      - .github/workflows/model.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: model-${{ github.ref }}
  cancel-in-progress: true

env:
  BLENDER_VERSION: 5.2.2
  BLENDER_SHA256: 84098912789dc450e95697c4184fb8a90acbe5111c2ba4aede3fecb57806a168

jobs:
  build:
    name: Build Kelo with Blender
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Set up pnpm (version from packageManager)
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Blender
        id: blender-cache
        uses: actions/cache@v6
        with:
          path: ~/blender
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64

      - name: Download Blender (checksum verified)
        if: steps.blender-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o blender.tar.xz \
            "https://download.blender.org/release/Blender${BLENDER_VERSION%.*}/blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          echo "${BLENDER_SHA256}  blender.tar.xz" | sha256sum -c -
          mkdir -p ~/blender
          tar -xf blender.tar.xz -C ~/blender --strip-components=1
          rm blender.tar.xz

      - name: Blender system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6 libgl1 libegl1

      - name: Build the model
        run: BLENDER="$HOME/blender/blender" pnpm build:model

      - name: Commit results to the branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/models assets/review/phase-3
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          SOURCE=$(jq -r .source assets/model/fit.json)
          STATUS=$(jq -r 'if .ok then "built" else "failed" end' assets/review/phase-3/summary.json)
          git commit -m "chore(model): ${STATUS} from ${SOURCE} (model run ${GITHUB_RUN_NUMBER})"
          for attempt in 1 2 3; do
            git pull --rebase --quiet && git push && exit 0
            sleep 5
          done
          exit 1
